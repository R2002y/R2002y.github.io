{id:'s72c2s1',title:'6.1 平方根',oneliner:'<strong>x²=a，x就是a的平方根。</strong>正数有两个平方根（一正一负），0只有一个。',prereq:'有理数、乘方',concepts:[['平方根','若x²=a，x是a的平方根。±3是9的平方根'],['算术平方根','平方根中的正数，√9=3。0的算术平方根是0'],['开平方','求平方根的运算，和平方互为逆运算'],['√a²','√a² = |a|，注意绝对值陷阱！']],questions:[{q:'√81 = ?',a:'9（算术平方根）'},{q:'9的平方根是？',a:'±3（平方根有两个）'}]},
{id:'s72c2s2',title:'6.2 立方根',oneliner:'<strong>x³=a，x是a的立方根。</strong>每个实数有且只有一个立方根，符号跟原数一致。',prereq:'平方根',concepts:[['立方根','若x³=a，x是a的立方根。³√8=2，³√-8=-2'],['平方根vs立方根','正数有两个平方根，但只有一个立方根。负数没有平方根，但有立方根']],questions:[{q:'³√-27=?',a:'-3（(-3)³=-27）'},{q:'³√64=?',a:'4（4³=64）'}]},
{id:'s72c2s3',title:'6.3 实数',oneliner:'<strong>实数 = 有理数 + 无理数，填满了整个数轴。</strong>√2、π终于有了正式的身份。',prereq:'平方根、立方根',concepts:[['无理数','无限不循环小数：√2、π、0.1010010001…'],['实数分类','实数 = 有理数（整数+分数）+ 无理数'],['实数和数轴','数轴上每个点对应唯一实数，一一对应'],['实数运算','加减乘除和有理数规则一致。|a| 同样适用']],questions:[{q:'√2、0、-3、π、0.333…中哪些是有理数？',a:'0、-3、0.333…（循环小数是有理数）'},{q:'估算√50在哪两个连续整数之间',a:'7²=49<50<8²=64，在7和8之间'}]}
]},
{id:'s72c3',title:'第七章 平面直角坐标系',sections:[
{id:'s72c3s1',title:'7.1 平面直角坐标系',oneliner:'<strong>用(x,y)精确标定平面上任何一个点。</strong>这是数形结合的起点——后面所有函数图像都靠它。',prereq:'数轴、实数',concepts:[['坐标轴','水平x轴+垂直y轴，交于原点(0,0)'],['点的坐标','(x,y)，x=横坐标，y=纵坐标'],['四个象限','一(+,+)二(-,+)三(-,-)四(+,-)。坐标轴上的点不属于任何象限'],['距离','到x轴距离=|y|，到y轴距离=|x|']],questions:[{q:'点A(3,-2)在第几象限？',a:'第四象限（x正y负）'},{q:'点(0,-5)在哪个象限？',a:'不在任何象限，在y轴负半轴上'}]},
{id:'s72c3s2',title:'7.2 坐标方法的简单应用',oneliner:'<strong>平移改坐标，对称变符号。</strong>用坐标描述位置变化，是GPS的原理。',prereq:'坐标系概念',concepts:[['平移','左右平移改x，上下平移改y。右+左-，上+下-'],['对称','关于x轴对称→y变号；关于y轴对称→x变号；关于原点对称→x、y都变号'],['方位','用方位角和距离确定位置（极坐标雏形）']],questions:[{q:'点(5,2)向左平移3个单位后的坐标？',a:'(2,2)'},{q:'点(-4,3)关于x轴的对称点是？',a:'(-4,-3)'}]}
]},
{id:'s72c4',title:'第八章 二元一次方程组',sections:[
{id:'s72c4s1',title:'8.1 二元一次方程（组）',oneliner:'<strong>含两个未知数、次数都是1的方程。</strong>两个这样的方程联立，通常有唯一解。',prereq:'一元一次方程',concepts:[['二元一次方程','含两个未知数，次数为1，如x+y=10'],['方程组','两个二元一次方程联立。解是同时满足两个方程的(x,y)值'],['解的情况','唯一解（两直线相交）、无解（平行）、无穷多解（重合）']],questions:[{q:'x+y=5有几个正整数解？',a:'(1,4)(2,3)(3,2)(4,1)，共4个'},{q:'什么叫方程组的解？',a:'同时满足两个方程的(x,y)值'}]},
{id:'s72c4s2',title:'8.2 消元——解二元一次方程组',oneliner:'<strong>核心就一个字——消。</strong>代入消元或加减消元，干掉一个未知数，变成一元一次方程。',prereq:'二元一次方程概念',concepts:[['代入消元法','从一个方程解出y（或x），代入另一个方程'],['加减消元法','对齐系数后两式相加减，直接消掉一个未知数'],['消元步骤','①选方法②消元③解一元一次方程④回代⑤写解⑥检验']],questions:[{q:'解：x+y=7, x-y=3',a:'两式相加→2x=10→x=5→y=2'},{q:'解：2x+y=8, 3x-2y=5',a:'一式×2→4x+2y=16，加二式→7x=21→x=3→y=2'}]},
{id:'s72c4s3',title:'8.3 实际问题与二元一次方程组',oneliner:'<strong>两个未知量？设两个未知数列方程组。</strong>鸡兔同笼是最经典的例子。',prereq:'消元法解方程组',concepts:[['列方程组','设两个未知数→找两个等量关系→列方程组→解→检验'],['常见模型','鸡兔同笼、和差倍分、行程追及、工程分配']],questions:[{q:'头35脚94，鸡兔各多少？',a:'设鸡x兔y：x+y=35,2x+4y=94→x=23,y=12'},{q:'A+B=30，A=2B，求A和B',a:'B+2B=30→B=10，A=20'}]}
]},
{id:'s72c5',title:'第九章 不等式与不等式组',sections:[
{id:'s72c5s1',title:'9.1 不等式及其解集',oneliner:'<strong>不是等号，是比较大小。</strong>解集的表示方法：不等式、数轴、集合描述。',prereq:'一元一次方程',concepts:[['不等号','> 大于, < 小于, ≥ 大于等于, ≤ 小于等于, ≠ 不等于'],['不等式性质','①加（减）同一个数，方向不变②乘（除）正数，方向不变③乘（除）负数，<b>方向反过来</b>'],['解集','不等式所有解组成的集合，通常用区间或数轴表示'],['⚠️易错','x>3和x≥3不是一回事。x>3的整数解中最小是4']],questions:[{q:'不等式3x+2>11的解集？',a:'3x>9→x>3'},{q:'-2x+5≤1',a:'-2x≤-4→x≥2（注意：÷(-2)变号！）'}]},
{id:'s72c5s2',title:'9.2 一元一次不等式的应用',oneliner:'<strong>把生活中的"不少于""不超过"翻译成不等式。</strong>注意解出来后取整。',prereq:'不等式解法',concepts:[['关键词','不少于→≥，不超过→≤，大于→>，小于→<'],['取整','实际问题中要注意解的合理性。32.5个需要取33个'],['解题步骤','审题→设未知数→列不等式→解→写答案']],questions:[{q:'某数加5不小于12，求这个数的范围',a:'x+5≥12→x≥7'},{q:'小明至少考多少分才能均分90？（4次成绩：85,92,88,x）',a:'(85+92+88+x)/4≥90→265+x≥360→x≥95分'}]},
{id:'s72c5s3',title:'9.3 一元一次不等式组',oneliner:'<strong>多个不等式联立，取公共部分（交集）。</strong>数轴上画区间，叠在一起的就是答案。',prereq:'一元一次不等式',concepts:[['不等式组','几个不等式联立。解组=各不等式解集的交集'],['解集类型','a<x<b（有解）、x>a且x<b无解（空集）、无解（矛盾）'],['数轴法','在数轴上画出所有解集，重叠区域即为解组'],['列不等式组','当问题有多个限制条件时，列不等式组']],questions:[{q:'解：x>3 且 x<8',a:'3 < x < 8'},{q:'解：x>5 且 x≤3',a:'无解（x既要>5又要≤3，矛盾）'}]}
]},
{id:'s72c6',title:'第十章 数据的收集、整理与描述',sections:[
{id:'s72c6s1',title:'10.1 统计调查',oneliner:'<strong>全面调查查全部，抽样调查抽部分。</strong>样本要有代表性，否则结论就歪了。',prereq:'小学数学统计',concepts:[['全面调查','对全体对象调查（如人口普查）。数据准确但成本高'],['抽样调查','抽取部分对象推断总体。关键：样本要有随机性和代表性'],['总体/个体/样本','总体=全部对象，个体=每个对象，样本=抽出来的部分，样本容量=样本数量']],questions:[{q:'抽样100人30人喜欢篮球，全校500人约多少人喜欢？',a:'30/100×500=150人'},{q:'"为省钱只调查一年级"有什么问题？',a:'样本不具代表性，不能反映全校情况'}]},
{id:'s72c6s2',title:'10.2 直方图与统计图',oneliner:'<strong>条形图比大小，扇形图看比例，折线图看趋势，直方图看分布。</strong>',prereq:'统计调查',concepts:[['条形图','用条的高度表示数量，方便比较不同类别'],['扇形图','用扇形面积表示比例。圆心角=百分比×360°'],['折线图','用线的走势表示变化趋势'],['频数分布直方图','把数据分组，看数据落在各区间的次数。组距=(最大值-最小值)÷组数']],questions:[{q:'扇形图中A占30%，圆心角？',a:'30%×360°=108°'},{q:'最大值95最小值35，分6组，组距？',a:'(95-35)÷6=10'}]}
]}
]},

s81:{title:'初二上',map:'三角形 → 全等三角形 → 轴对称 → 整式的乘法与因式分解 → 分式',chapters:[
{id:'s81c1',title:'第十一章 三角形',sections:[
{id:'s81c1s1',title:'11.1 与三角形有关的线段',oneliner:'<strong>三条边构成的封闭图形。三边关系、中线、高、角平分线是三角形的基本语言。</strong>',prereq:'角的概念',concepts:[['三边关系','任意两边之和>第三边，任意两边之差<第三边'],['高中线角平分线','高=顶点到对边垂线段；中线=顶点到对边中点；角平分线=平分内角的射线'],['重心','三条中线交于一点。重心到顶点距离=到对边中点距离的2倍'],['稳定性','三边定了形状就唯一确定。四边形没有这个性质']],questions:[{q:'下列哪组能构成三角形？A.2,3,6 B.3,4,5 C.1,1,3',a:'B。2+3=5<6✗，3+4=7>5✓，1+1=2<3✗'},{q:'画三角形三条中线，它们有什么特性？',a:'交于一点（重心）'}]},
{id:'s81c1s2',title:'11.2 与三角形有关的角',oneliner:'<strong>三个内角和永远是180°。</strong>外角等于不相邻两内角之和，这是几何推导的利器。',prereq:'三角形基本概念',concepts:[['内角和定理','三角形三个内角和=180°。任何三角形都成立'],['外角性质','外角=不相邻两内角之和。外角>任何一个不相邻的内角'],['直角三角形','一个角=90°的叫直角三角形。两锐角互余（和=90°）']],questions:[{q:'三角形两角50°和60°，第三个角？',a:'180°-50°-60°=70°'},{q:'三角形一个外角120°，不相邻一内角50°，另一个内角？',a:'120°-50°=70°'}]},
{id:'s81c1s3',title:'11.3 多边形及其内角和',oneliner:'<strong>n边形内角和=(n-2)×180°，外角和永远是360°。</strong>从一个顶点画对角线拆分三角形就能推导。',prereq:'三角形内角和',concepts:[['多边形','n条线段首尾连接成的封闭图形。对角线=不相邻顶点连线'],['内角和公式','n边形内角和=(n-2)×180°'],['外角和','任意多边形外角和恒为360°（绕着多边形转一圈）'],['正多边形','各边相等、各角相等的多边形']],questions:[{q:'五边形内角和？',a:'(5-2)×180°=540°'},{q:'正六边形每个内角？',a:'(6-2)×180°÷6=720°÷6=120°'}]}
]},
{id:'s81c2',title:'第十二章 全等三角形',sections:[
{id:'s81c2s1',title:'12.1 全等三角形',oneliner:'<strong>形状大小完全一样，能完全重合。</strong>这是初中几何证明的「万能工具」——证边相等角相等都靠它。',prereq:'三角形',concepts:[['全等定义','能完全重合的两个三角形。对应边相等，对应角相等'],['全等符号','△ABC≌△DEF，注意字母顺序必须对应'],['全等性质','全等三角形周长面积都相等']],questions:[{q:'全等的两个三角形有什么相同？',a:'对应边相等、对应角相等、周长相等、面积相等'},{q:'周长相等的两个三角形一定全等吗？',a:'不一定。比如边长3,4,5和2.5,5,4.5周长都是12但边不同'}]},
{id:'s81c2s2',title:'12.2 三角形全等的判定',oneliner:'<strong>SSS、SAS、ASA、AAS、HL——五种判定法，唯独没有SSA。</strong>',prereq:'全等概念',concepts:[['SSS','三边对应相等→全等（最稳）'],['SAS','两边及<b>夹角</b>对应相等→全等'],['ASA','两角及<b>夹边</b>对应相等→全等'],['AAS','两角及一角<b>对边</b>对应相等→全等'],['HL','直角三角形：斜边+一直角边对应相等→全等'],['⚠️SSA','两边和一角（非夹角）<b>不能</b>判定全等！'],['证明格式','在△ABC和△DEF中→列条件→∴△ABC≌△DEF(依据)']],questions:[{q:'哪组不能判定全等？A.SSS B.SAS C.SSA D.ASA',a:'C。SSA不能（角不夹边时有两种可能）'},{q:'已知AB=DE，∠A=∠D，还需什么用SAS判定？',a:'AC=DF（∠A的夹边）'}]},
{id:'s81c2s3',title:'12.3 角的平分线的性质',oneliner:'<strong>角平分线上的点到角两边的距离相等。</strong>逆定理也成立——到角两边距离相等的点在平分线上。',prereq:'全等三角形',concepts:[['角平分线性质','角平分线上的点到角两边距离相等'],['逆定理','到角两边距离相等的点在角平分线上'],['证明思路','角平分线性质通常用HL或AAS证明']],questions:[{q:'角平分线OP上一点P，P到OA距离3，P到OB距离？',a:'也是3（角平分线上点到两边距离相等）'},{q:'如何证明角平分线性质？',a:'作垂线→证两个直角三角形全等(HL)→距离相等'}]}
]},
{id:'s81c3',title:'第十三章 轴对称',sections:[
{id:'s81c3s1',title:'13.1 轴对称',oneliner:'<strong>沿一条线折叠，两边完全重合。</strong>对称轴是垂直平分线——到两端距离相等。',prereq:'全等三角形',concepts:[['轴对称','沿某直线折叠后重合。该直线叫<b>对称轴</b>'],['垂直平分线','过线段中点且垂直。线上任意点到线段两端距离相等'],['轴对称性质','对称点的连线被对称轴垂直平分']],questions:[{q:'线段AB=10cm，垂直平分线上一点P，PA=6，PB=?',a:'6cm（垂直平分线上点到两端距离相等）'},{q:'两个点关于x轴对称，它们的坐标有什么关系？',a:'x坐标相同，y坐标互为相反数'}]},
{id:'s81c3s2',title:'13.2 画轴对称图形',oneliner:'<strong>找关键点的对称点，连起来就行。</strong>几何画图的基本功。',prereq:'轴对称概念',concepts:[['画法','①找关键点②作垂直③量取等距④连接'],['关于坐标轴对称','关于x轴对称(x,-y)，关于y轴对称(-x,y)']],questions:[{q:'画△ABC关于直线l的对称图形，需要找几个对称点？',a:'3个（三角形的3个顶点）'}]},
{id:'s81c3s3',title:'13.3 等腰三角形',oneliner:'<strong>两腰相等→两底角相等。</strong>三线合一（顶角平分线=底边中线=底边高）是最强大的工具。',prereq:'轴对称、全等三角形',concepts:[['等腰三角形','两腰相等。等边对等角→两底角相等'],['三线合一','顶角平分线=底边中线=底边高，三线是同一根！'],['等边三角形','三边相等=三角各60°。每条边上的高/中线/平分线都合一'],['判定','两角相等→两腰相等（等角对等边）']],questions:[{q:'等腰三角形顶角80°，底角？',a:'(180°-80°)÷2=50°'},{q:'等腰三角形底边上的高也是什么？',a:'也是底边的中线和顶角的平分线（三线合一）'}]}
]},
{id:'s81c4',title:'第十四章 整式的乘法与因式分解',sections:[
{id:'s81c4s1',title:'14.1 整式的乘法',oneliner:'<strong>单项式乘多项式逐项相乘，多项式乘多项式每一项乘每一项。</strong>幂的运算法则是一切的基础。',prereq:'整式的加减（初一上）',concepts:[['同底数幂乘','aᵐ·aⁿ=aᵐ⁺ⁿ'],['幂的乘方','(aᵐ)ⁿ=aᵐⁿ'],['积的乘方','(ab)ⁿ=aⁿbⁿ'],['单项式乘多项式','逐项相乘。2x(x+3)=2x²+6x'],['多项式乘多项式','每一项乘每一项。(x+2)(x+3)=x²+5x+6']],questions:[{q:'计算：(2x+1)(x-3)',a:'=2x²-6x+x-3=2x²-5x-3'},{q:'a²·a³=? (a²)³=?',a:'a²·a³=a⁵，(a²)³=a⁶'}]},
{id:'s81c4s2',title:'14.2 乘法公式',oneliner:'<strong>平方差 (a+b)(a-b)=a²-b²，完全平方(a±b)²=a²±2ab+b²。</strong>这两个公式是代数运算的加速器。',prereq:'整式乘法',concepts:[['平方差公式','(a+b)(a-b)=a²-b²。两数和×两数差=平方差'],['完全平方公式','(a+b)²=a²+2ab+b²，(a-b)²=a²-2ab+b²'],['注意','(a+b)²≠a²+b²！中间有2ab'],['公式逆用','a²-b²=(a+b)(a-b)（因式分解时用）']],questions:[{q:'计算：(x+5)(x-5)',a:'=x²-25（平方差公式）'},{q:'计算：(x+3)²',a:'=x²+6x+9（完全平方公式）'}]},
{id:'s81c4s3',title:'14.3 因式分解',oneliner:'<strong>把一个多项式写成乘积形式。</strong>三种方法：提公因式、套公式、十字相乘。',prereq:'整式乘法、乘法公式',concepts:[['定义','把一个多项式化为几个整式的乘积'],['提公因式法','先找各项的公因式提出来。如3x²+6x=3x(x+2)'],['公式法','套平方差/完全平方倒推。x²-9=(x+3)(x-3)'],['十字相乘法','x²+(a+b)x+ab=(x+a)(x+b)。解二次方程的关键'],['步骤','一提（公因式）→二代（套公式）→三十字（相乘）']],questions:[{q:'因式分解：x²-9',a:'=(x+3)(x-3)（平方差）'},{q:'因式分解：x²+7x+12',a:'找和=7积=12→3和4。=(x+3)(x+4)'}]}
]},
{id:'s81c5',title:'第十五章 分式',sections:[
{id:'s81c5s1',title:'15.1 分式的基本概念',oneliner:'<strong>分母含字母、分母≠0。</strong>分式的基本性质：分子分母同乘除，值不变。',prereq:'因式分解',concepts:[['分式定义','A/B，B含字母且B≠0'],['有意义条件','分母≠0。x=3时分式(x+2)/(x-3)无意义'],['基本性质','分子分母同乘（除非零），分式值不变'],['约分/通分','约分=分子分母同除公因式；通分=化成分母相同的分式']],questions:[{q:'分式(x+2)/(x-3)何时无意义？何时值为0？',a:'x=3无意义；x=-2时值为0'},{q:'化简：(x²-4)/(x+2)',a:'=(x+2)(x-2)/(x+2)=x-2（x≠-2）'}]},
{id:'s81c5s2',title:'15.2 分式的运算',oneliner:'<strong>加减先通分，乘法分子×分子分母×分母，除法乘倒数。</strong>规则和分数一模一样。',prereq:'分式基本概念',concepts:[['乘法','分子×分子，分母×分母。约分化简'],['除法','除以一个分式=乘以它的倒数'],['加减法','先通分（找最简公分母）再加减分子'],['混合运算','先乘除后加减，有括号先算括号']],questions:[{q:'计算：1/x + 2/x',a:'=3/x（分母相同直接加分子）'},{q:'计算：(2x²/y)·(3y/4x)',a:'=(2x²·3y)/(y·4x)=(6x²y)/(4xy)=(3x)/(2)'}]},
{id:'s81c5s3',title:'15.3 分式方程',oneliner:'<strong>去分母化为整式方程，解完必须验根！</strong>增根=去分母后引入的不满足原方程的根。',prereq:'分式运算、一元一次方程',concepts:[['解法','去分母→解整式方程→验根（去掉使分母为0的增根）'],['增根','去分母后多出来的根，检验发现分母=0就要舍去'],['步骤','①去分母②解方程③检验④作答'],['注意','解分式方程必须写检验过程']],questions:[{q:'解：2/x=1/(x-1)',a:'交叉相乘→2(x-1)=x→x=2。检验分母≠0✓'},{q:'什么叫增根？',a:'满足去分母后的整式方程但不满足原分式方程的根'}]}
]}

s82:{title:'初二下',map:'二次根式 → 勾股定理 → 平行四边形 → 一次函数 → 数据的分析',chapters:[
{id:'s82c1',title:'第十六章 二次根式',sections:[
{id:'s82c1s1',title:'16.1 二次根式的概念与性质',oneliner:'<strong>√a 表示 a 的算术平方根（a≥0）。</strong>(√a)²=a，但 √(a²)=|a|，这里有坑。',prereq:'实数（初一下第六章）',concepts:[['定义','√a是a的算术平方根，a≥0'],['(√a)²=a','平方和开方互逆（a≥0）'],['√(a²)=|a|','注意绝对值！√((-3)²)=|−3|=3，不是−3'],['双重非负性','a≥0 且 √a≥0']],questions:[{q:'√(x-1)何时有意义？',a:'x-1≥0→x≥1'},{q:'√((-5)²)=?',a:'=|-5|=5'}]},
{id:'s82c1s2',title:'16.2 二次根式的乘除',oneliner:'<strong>√a·√b=√(ab)，√a/√b=√(a/b)。</strong>先化简再运算，化到最简为止。',prereq:'二次根式概念',concepts:[['乘法','√a·√b=√(ab)（a,b≥0）'],['除法','√a/√b=√(a/b)（a≥0,b>0）'],['最简二次根式','被开方数不含分母、不含能开尽方的因数'],['分母有理化','把分母的根号去掉。1/√2=√2/2']],questions:[{q:'化简：√50',a:'=√(25×2)=5√2'},{q:'计算：√12÷√3',a:'=√(12/3)=√4=2'}]},
{id:'s82c1s3',title:'16.3 二次根式的加减',oneliner:'<strong>同类二次根式才能合并，就像同类项一样。</strong>先化简每个根式再合并。',prereq:'二次根式乘除',concepts:[['同类二次根式','化简后被开方数相同的根式。√8和√2化简后=2√2和√2是同类'],['加减法','先化简→合并同类根式（系数加减）'],['混合运算','和整式混合运算一样，先乘除后加减，有括号先算']],questions:[{q:'计算：√12+√27',a:'=2√3+3√3=5√3'},{q:'√8+√2=?',a:'=2√2+√2=3√2'}]}
]},
{id:'s82c2',title:'第十七章 勾股定理',sections:[
{id:'s82c2s1',title:'17.1 勾股定理',oneliner:'<strong>直角三角形中，a²+b²=c²。</strong>几千年历史的定理，至今是几何计算最实用的工具。',prereq:'二次根式、三角形',concepts:[['勾股定理','Rt△中，两直角边平方和=斜边平方。a²+b²=c²'],['勾股数','满足a²+b²=c²的正整数。如(3,4,5)(5,12,13)(7,24,25)'],['应用','已知两边求第三边；判断是否为直角；实际测距'],['特殊三角形','30°Rt△：30°对边=斜边一半。等腰Rt△：斜边=直角边×√2']],questions:[{q:'直角边6和8，斜边？',a:'6²+8²=36+64=100→斜边=10'},{q:'30°Rt△斜边10，最短直角边？',a:'10÷2=5（30°对边=斜边一半）'}]},
{id:'s82c2s2',title:'17.2 勾股定理的逆定理',oneliner:'<strong>三边满足a²+b²=c²，必是直角三角形。</strong>判定直角不用量角器，算一下就知道了。',prereq:'勾股定理',concepts:[['逆定理','若三角形三边满足a²+b²=c²，则该三角形是直角三角形（c边所对角是直角）'],['判定方法','计算两短边的平方和，看是否等于最长边平方']],questions:[{q:'三边5,12,13能构成直角三角形吗？',a:'5²+12²=25+144=169=13²✓，是直角三角形'},{q:'三边4,5,6是直角三角形吗？',a:'4²+5²=16+25=41≠36=6²，不是'}]}
]},
{id:'s82c3',title:'第十八章 平行四边形',sections:[
{id:'s82c3s1',title:'18.1 平行四边形',oneliner:'<strong>两组对边分别平行。</strong>对边相等、对角相等、对角线互相平分。这是四边形家族的根源。',prereq:'全等三角形、平行线',concepts:[['定义','两组对边分别平行的四边形'],['性质','对边平行且相等、对角相等、邻角互补、对角线互相平分'],['判定','①两组对边分别平行②两组对边分别相等③一组对边平行且相等④对角线互相平分'],['三角形中位线','连接两边中点→平行于第三边且=第三边一半。超级常用']],questions:[{q:'平行四边形一个角70°，其余三角？',a:'对角70°，邻角110°。四个角：70°,110°,70°,110°'},{q:'三角形两腰中点连线叫什么？和底边什么关系？',a:'中位线。平行于底边且=底边一半'}]},
{id:'s82c3s2',title:'18.2 特殊的平行四边形',oneliner:'<strong>矩形=直角+平行四边形，菱形=等边+平行四边形，正方形=矩形∩菱形。</strong>它们的关系像家族谱。',prereq:'平行四边形',concepts:[['矩形','一个角是直角的▱。对角线相等。四个角都90°'],['菱形','一组邻边相等的▱。对角线互相垂直平分。四边相等'],['正方形','同时是矩形和菱形。四边相等、四角90°、对角线相等且垂直平分'],['关系图','平行四边形⊃矩形、菱形⊃正方形']],questions:[{q:'矩形对角线有什么特点？',a:'相等且互相平分'},{q:'菱形边长5，一对角线6，另一对角线？',a:'垂直平分→半对角线=3→另一半=√(5²-3²)=4→对角线=8'}]}
]},
{id:'s82c4',title:'第十九章 一次函数',sections:[
{id:'s82c4s1',title:'19.1 函数',oneliner:'<strong>对于x的每个值，y有唯一确定的值对应。</strong>y是x的函数。这是从"计算"到"关系"的思维升级。',prereq:'平面直角坐标系',concepts:[['函数','在一个变化过程中，对于x的每一个确定值，y有唯一值与之对应'],['自变量/因变量','x是自变量（输入），y是因变量（输出）'],['函数值','当x=a时，计算出的y值'],['三种表示法','解析式、列表法、图像法']],questions:[{q:'y²=x，y是x的函数吗？',a:'不是。x=4时y可以是2或-2，不唯一'},{q:'圆的面积S=πr²，S是r的函数吗？',a:'是。每个r对应唯一S'}]},
{id:'s82c4s2',title:'19.2 一次函数',oneliner:'<strong>y=kx+b，画出来是一条直线。</strong>k是斜率（陡不陡），b是截距（在哪穿过y轴）。',prereq:'函数概念、坐标系',concepts:[['正比例函数','y=kx(k≠0)，过原点的直线。k>0上升，k<0下降'],['一次函数','y=kx+b(k≠0)。k=斜率，b=y轴截距(0,b)'],['k的作用','k>0：y随x增大而增大（上坡）；k<0：y随x增大而减小（下坡）；|k|越大越陡'],['b的作用','与y轴交点。b>0交上方，b<0交下方。（0,b）是必过点'],['待定系数法','已知两点：设y=kx+b，代入→解k和b']],questions:[{q:'过(0,3)(2,7)的一次函数解析式',a:'b=3,2k+3=7→k=2。y=2x+3'},{q:'y=-x+4和y=x的交点？',a:'-x+4=x→2x=4→x=2,y=2。交点(2,2)'}]}
]},
{id:'s82c5',title:'第二十章 数据的分析',sections:[
{id:'s82c5s1',title:'20.1 数据的集中趋势',oneliner:'<strong>平均数看中心，中位数看位置，众数看频率。</strong>不同指标各有各的用处。',prereq:'数据的收集（初一下第十章）',concepts:[['平均数','所有数据之和÷数据个数'],['加权平均数','各数据乘权重后求和÷权重和'],['中位数','排序后最中间的数（偶数个取中间两数平均）'],['众数','出现次数最多的数。可以有一个或多个']],questions:[{q:'1,4,7,7,10的中位数？',a:'排序后中间是7'},{q:'5个数据：3,7,5,7,8的平均数和众数',a:'平均数=6，众数=7（出现2次）'}]},
{id:'s82c5s2',title:'20.2 数据的波动程度',oneliner:'<strong>方差和标准差衡量数据稳不稳定。</strong>选人参赛不能只看平均分，还得看谁波动小。',prereq:'数据的集中趋势',concepts:[['极差','最大值-最小值。最简单但粗糙'],['方差','每个数据与平均数之差的平方和÷数据个数。越大越不稳'],['标准差','方差的算术平方根，和原数据单位一致。更直观'],['应用','平均数相同比方差。方差小的更稳定']],questions:[{q:'两组数据平均数相同，怎么选？',a:'计算方差。方差小的更稳定'},{q:'2,4,4,6,8的极差？',a:'8-2=6'}]}
]}
]},

s91:{title:'初三上',map:'一元二次方程 → 二次函数 → 旋转 → 圆 → 概率初步',chapters:[
{id:'s91c1',title:'第二十一章 一元二次方程',sections:[
{id:'s91c1s1',title:'21.1 一元二次方程',oneliner:'<strong>含x²的方程，一般形式ax²+bx+c=0（a≠0）。</strong>解就是抛物线与x轴的交点。',prereq:'整式、因式分解',concepts:[['定义','含一个未知数，最高次数为2的整式方程。ax²+bx+c=0(a≠0)'],['解/根','使方程成立的x值。二次方程最多两个解'],['降次思想','把二次降为一次来解——配方法、因式分解法都是这个思路']],questions:[{q:'x²=4的解是？',a:'x=±2（二次方程有两个解）'},{q:'方程x²+1=0有实数解吗？',a:'没有。x²≥0所以x²+1≥1>0，无解'}]},
{id:'s91c1s2',title:'21.2 解一元二次方程',oneliner:'<strong>三条路：配方、公式、因式分解。</strong>公式法是万能兜底的，但十字相乘法最快。',prereq:'因式分解',concepts:[['配方法','通过变形变成(x+m)²=n，再开平方'],['求根公式','x=[-b±√(b²-4ac)]/(2a)'],['判别式Δ','Δ=b²-4ac。Δ>0两个不等实根；Δ=0两个相等实根；Δ<0无实根'],['因式分解法','最快的解法。把二次式分解为两个一次式乘积'],['根与系数','x₁+x₂=-b/a，x₁·x₂=c/a（韦达定理）']],questions:[{q:'解：x²-5x+6=0',a:'因式分解(x-2)(x-3)=0→x=2或3'},{q:'2x²-4x-1=0用求根公式',a:'x=[4±√(16+8)]/4=[4±√24]/4=1±√6/2'},{q:'x²+x-6=0两根之和与积？',a:'和=-1，积=-6（韦达定理）'}]},
{id:'s91c1s3',title:'21.3 实际问题与一元二次方程',oneliner:'<strong>增长率、面积、利润——二次方程是应用题里的重头戏。</strong>解出来记得检验合理性。',prereq:'解一元二次方程',concepts:[['增长率模型','a(1±x)ⁿ=b。增长率>1，下降率<1'],['面积问题','矩形面积=长×宽。修路、建花园常用二次方程'],['利润问题','利润=(售价-成本)×销量。求最大利润→二次函数'],['检验','解必须符合实际意义（长度>0、人数为正整数等）']],questions:[{q:'某商品连续两次降价20%，原价100，现价？',a:'100×(1-0.2)²=100×0.64=64元'},{q:'长方形长比宽多2，面积48，求长宽',a:'设宽x：x(x+2)=48→x²+2x-48=0→(x+8)(x-6)=0→x=6，长=8'}]}
]},
{id:'s91c2',title:'第二十二章 二次函数',sections:[
{id:'s91c2s1',title:'22.1 二次函数的图象和性质',oneliner:'<strong>y=ax²+bx+c，画出来是一条抛物线。</strong>a>0开口向上∪，a<0开口向下∩。顶点是最高/最低点。',prereq:'一元二次方程、一次函数',concepts:[['一般式','y=ax²+bx+c。|a|越大开口越窄'],['顶点式','y=a(x-h)²+k，顶点(h,k)。对称轴x=h'],['对称轴','x=-b/(2a)。抛物线关于此线对称'],['顶点坐标','(-b/(2a), (4ac-b²)/(4a))→函数的最大/最小值'],['平移','y=(x-h)²+k就是把y=x²平移→右h，上k'],['开口','a>0开口向上∪（有最小值），a<0开口向下∩（有最大值）']],questions:[{q:'y=x²-4x+3的顶点坐标',a:'配方y=(x-2)²-1，顶点(2,-1)'},{q:'y=2(x-1)²+3的对称轴和最小值',a:'对称轴x=1，最小值=3（x=1时）'}]},
{id:'s91c2s2',title:'22.2 二次函数与一元二次方程',oneliner:'<strong>抛物线y=ax²+bx+c与x轴的交点，就是方程ax²+bx+c=0的根。</strong>Δ决定有几个交点。',prereq:'二次函数图像、一元二次方程',concepts:[['与x轴交点','解ax²+bx+c=0。Δ>0有2个交点，Δ=0相切（1个），Δ<0无交点'],['不等式','利用图像判断ax²+bx+c>0在哪些区间成立']],questions:[{q:'y=-x²+2x+3与x轴的交点',a:'解x²-2x-3=0→(x-3)(x+1)=0→(3,0)和(-1,0)'},{q:'什么时候二次函数值恒为正？',a:'a>0且Δ<0，抛物线全在x轴上方'}]}
]},
{id:'s91c3',title:'第二十三章 旋转',sections:[
{id:'s91c3s1',title:'23.1 图形的旋转',oneliner:'<strong>图形绕一个点转一定角度，形状大小不变。</strong>旋转是全等变换——只变方向不变形。',prereq:'全等三角形',concepts:[['旋转三要素','旋转中心、旋转方向（顺时针/逆时针）、旋转角度'],['旋转性质','对应点到中心距离相等、对应点与中心夹角=旋转角、图形全等'],['坐标变换','(x,y)绕原点逆时针转90°→(-y,x)']],questions:[{q:'点A(2,0)绕原点逆时针转90°后坐标？',a:'(0,2)'},{q:'旋转改变图形大小吗？',a:'不改变。旋转是全等变换'}]},
{id:'s91c3s2',title:'23.2 中心对称',oneliner:'<strong>绕一点转180°后重合，叫中心对称。</strong>平行四边形、圆是典型的中心对称图形。',prereq:'旋转',concepts:[['中心对称','图形绕某点旋转180°后与自身重合。该点叫对称中心'],['中心对称图形','对称中心平分连接对应点的线段'],['关于原点对称','(x,y)关于原点对称→(-x,-y)']],questions:[{q:'正方形是中心对称图形吗？',a:'是。绕中心转90°或180°都重合'},{q:'点(3,-4)关于原点对称的坐标？',a:'(-3,4)'}]}
]},
{id:'s91c4',title:'第二十四章 圆',sections:[

// ==================== RENDER ====================
let currentSem = 's71';
let activeSection = null;
const checked = JSON.parse(localStorage.getItem('math_sec_checklist') || '{}');

function countTotalDone() {
  let total = 0, done = 0;
  Object.values(DATA).forEach(s => s.chapters.forEach(ch => ch.sections.forEach(sec => {
    total++;
    if (checked[sec.id]) done++;
  })));
  return { total, done };
}

function updateProgress() {
  const { total, done } = countTotalDone();
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${total} 节已学`;
}

function buildSemNav() {
  const nav = document.getElementById('semNav');
  const keys = ['s71','s72','s81','s82','s91','s92'];
  nav.innerHTML = keys.map(k => {
    const d = DATA[k];
    const cls = k === currentSem ? 'sem-btn active' : 'sem-btn';
    return `<button class="${cls}" data-sem="${k}">${d.title}</button>`;
  }).join('');
}

function buildTree() {
  const tree = document.getElementById('tree');
  const d = DATA[currentSem];
  let html = '';
  d.chapters.forEach(ch => {
    html += `<div class="chapter-node">
      <button class="chapter-toggle" data-ch="${ch.id}" onclick="toggleChapter(this)">
        <span class="arrow">▶</span>
        <span class="ch-icon">📖</span>${ch.title}
      </button>
      <div class="sections-list" id="list-${ch.id}">`;
    ch.sections.forEach(sec => {
      const cls = activeSection === sec.id ? 'section-link active' : 'section-link';
      html += `<a class="${cls}" data-sid="${sec.id}" onclick="scrollToSection('${sec.id}')">${sec.title}</a>`;
    });
    html += `</div></div>`;
  });
  tree.innerHTML = html;
}

function toggleChapter(btn) {
  const chId = btn.dataset.ch;
  const list = document.getElementById('list-' + chId);
  const arrow = btn.querySelector('.arrow');
  list.classList.toggle('open');
  arrow.classList.toggle('open');
}

function scrollToSection(sid) {
  activeSection = sid;
  buildTree();
  const el = document.getElementById(sid);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('highlight');
    setTimeout(() => el.classList.remove('highlight'), 1500);
  }
}

function toggleAnswer(btn) {
  const answer = btn.nextElementSibling;
  const open = answer.classList.contains('show');
  answer.classList.toggle('show');
  btn.classList.toggle('open');
  btn.innerHTML = open ? '▶ 查看答案' : '▼ 隐藏答案';
}

function toggleSecCheck(sid, cb) {
  checked[sid] = cb.checked;
  localStorage.setItem('math_sec_checklist', JSON.stringify(checked));
  updateProgress();
}

function renderMain() {
  const main = document.getElementById('main');
  const d = DATA[currentSem];
  let html = `<div class="semester-header"><h2>${d.title}</h2><div class="map">📌 ${d.map}</div></div>`;

  d.chapters.forEach(ch => {
    html += `<div class="chapter-block">
      <div class="chapter-block-header">
        <h3>${ch.title}</h3>
        <span class="ch-num">${ch.sections.length} 节</span>
      </div>`;

    ch.sections.forEach(sec => {
      const done = checked[sec.id];
      html += `<div class="section-card" id="${sec.id}">
        <div class="section-card-top">
          <h4>${sec.title}</h4>
          <span class="tag">📖 概念</span>
        </div>
        <div class="one-liner">💡 ${sec.oneliner}</div>
        <table class="concept-table"><thead><tr><th>概念</th><th>大白话</th></tr></thead><tbody>`;
      sec.concepts.forEach(c => {
        html += `<tr><td>${c[0]}</td><td>${c[1]}</td></tr>`;
      });
      html += `</tbody></table>`;
      html += `<div class="prereq">📌 前置知识：${sec.prereq}</div>`;

      if (sec.questions && sec.questions.length) {
        html += `<div class="questions"><h5>✅ 验证题</h5>`;
        sec.questions.forEach((q, qi) => {
          html += `<div class="question-item">
            <div class="q">${qi + 1}. ${q.q}</div>
            <button class="a-toggle" onclick="toggleAnswer(this)">▶ 查看答案</button>
            <div class="answer">${q.a}</div>
          </div>`;
        });
        html += `</div>`;
      }

      html += `<div class="section-footer">
        <label><input type="checkbox" ${done ? 'checked' : ''} onchange="toggleSecCheck('${sec.id}', this)"> 这节我学会了</label>
      </div></div>`;
    });
    html += `</div>`;
  });

  main.innerHTML = html;
}

function switchSemester(key) {
  currentSem = key;
  activeSection = null;
  buildSemNav();
  buildTree();
  renderMain();
  updateProgress();
  // Auto-expand all chapters
  document.querySelectorAll('.chapter-toggle').forEach(btn => {
    toggleChapter(btn);
  });
}

document.getElementById('semNav').addEventListener('click', e => {
  const btn = e.target.closest('.sem-btn');
  if (btn) switchSemester(btn.dataset.sem);
});

buildSemNav();
buildTree();
renderMain();
updateProgress();
// Auto-expand chapters on load
document.querySelectorAll('.chapter-toggle').forEach(btn => toggleChapter(btn));
</script>
</body>
</html>
